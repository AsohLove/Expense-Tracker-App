<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">

</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Expense Tracker</h1>

            <div class="theme-toggle">
                <label class="switch">
                    <input type="checkbox" id="theme-toggle">
                    <span class="slider"></span>
                </label>
                <span id="theme-label">Light Mode</span>
            </div>
        </div>


        <div class="balance-container">
            <h3>Total Balance</h3>
            <h2 id="balance">$0.00</h2>

            <div class="actions">
                <input type="number" id="top-up-amount" placeholder="Top Up Amount" value="100">
                <button onclick="quickAdd('top')">+ Top Up</button>

                <input type="number" id="transfer-amount" placeholder="Transfer Amount" value="50">
                <button onclick="quickAdd('transfer')">Transfer</button>
            </div>
        </div>

        <div class="summary">

            <div>
                <h4>Income</h4>
                <p id="income" class="income">$0.00</p>
            </div>

            <div>
                <h4>Expenses</h4>
                <p id="expense" class="expense">$0.00</p>
            </div>

        </div>


        <h3>Add Transaction</h3>

        <form id="transaction-form">

            <input type="text" id="description" placeholder="Description" required>

            <input type="number" id="amount" placeholder="Amount (+ income, - expense)" required>

            <input type="date" id="date" required>

            <button type="submit">Add Transaction</button>

        </form>


        <div class="filters">

            <button onclick="filterTransactions('all')">All</button>

            <button onclick="filterTransactions('income')">Income</button>

            <button onclick="filterTransactions('expense')">Expenses</button>

        </div>


        <h3>Transaction History</h3>

        <ul id="transaction-list"></ul>


        <h3>Spending Analysis</h3>

        <canvas id="expense-chart"></canvas>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>

</body>

</html>
